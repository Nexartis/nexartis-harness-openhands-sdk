---
name: Check duplicate example numbers

on:
    pull_request:
        branches:
            - '**'
        paths:
            - examples/**
            - .github/workflows/check-duplicate-examples.yml
            - .github/scripts/check_duplicate_example_numbers.py
    push:
        branches:
            - main
        paths:
            - examples/**
    workflow_dispatch:

permissions:
    contents: read

concurrency:
  group: check-duplicate-examples-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    check-duplicates:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Set up Python
              uses: actions/setup-python@v7
              with:
                  python-version: '3.13'

            - name: Check for duplicate example numbers
              run: python .github/scripts/check_duplicate_example_numbers.py
